name: Build

on:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - depot-ubuntu-24.04-4
          - depot-ubuntu-24.04-arm-4
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Build
        run: make build

      - name: Test
        run: make test