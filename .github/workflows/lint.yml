name: Lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8.0.0
      with:
        version: v2.4.0
        only-new-issues: true
        args: --timeout=15m
