name: Solidity Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: forge build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--sizes` enforces EIP-170 (24576 bytes) which our chain raises to
      # 49152 via the cosmos/go-ethereum fork — and the
      # AnonEncNullifierNonRepudiation impl is ~28 KB. `code_size_limit`
      # in foundry.toml lifts the cap for `forge test`'s EVM, but `--sizes`
      # ignores it. Drop the flag; the test job exercises real deploys.
      - working-directory: contracts
        run: forge build
