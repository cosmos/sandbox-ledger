name: Solidity Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: forge build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # code-size-limit matches local-node.sh; some Zeto verifiers exceed
      # the default 24576 byte cap and we deliberately raise it.
      - working-directory: contracts
        run: forge build --sizes --code-size-limit 65535
