name: Solidity Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: forge build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # code-size-limit (65535) is set in foundry.toml; some Zeto verifiers
      # exceed the default 24576 byte cap.
      - working-directory: contracts
        run: forge build --sizes
