[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"

# Match Zeto's Hardhat compiler settings exactly.
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 25
via_ir = true

# Zeto_AnonEncNullifierNonRepudiation (~28 KB) and its batch verifier
# (~24.8 KB) exceed EIP-170's 24576-byte runtime cap. The sandbox chain
# ships a forked go-ethereum with MaxCodeSize=49152, so these deploy
# fine on-chain; this setting tells the test EVM not to abort on them.
# Required — without it, the NonRepudiation smoke test reverts with
# CreateContractSizeLimit.
code_size_limit = 65535

evm_version = "prague"

# Allow scripts to read Poseidon bytecode and update deployment manifests.
fs_permissions = [
    { access = "read", path = "./poseidon" },
    { access = "read-write", path = "./deployments" },
]

[fmt]
# Bump line length above the longest vendored import path (the Zeto
# NonRepudiation verifier filenames push imports to ~130 chars). At
# the default 120, older and newer foundry versions wrap import lines
# differently — older puts the path on the next line, newer puts the
# symbol inside `{ ... }` — so `--check` flips depending on which
# foundry version CI installs. Setting the budget above the longest
# line stops both from wrapping.
line_length = 140

# Vendored iden3 SmtLib shim — we don't own the formatting style.
ignore = [
    "src/iden3-shims/SmtLib.sol",
]

[rpc_endpoints]
sandbox = "http://127.0.0.1:8545"
